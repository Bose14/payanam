[build]
  command = "npm install --prefix packages/config && npm install --prefix packages/types && npm install --prefix packages/utils && npm install --prefix apps/web && npm run build --prefix apps/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
