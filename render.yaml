services:
  - type: web
    name: payanam-api
    env: node
    plan: free
    buildCommand: npm install --prefix packages/config && npm install --prefix packages/types && npm install --prefix packages/utils && npm install --prefix apps/api && npm run build --prefix apps/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
