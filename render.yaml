services:
  - type: web
    name: payanam-api
    env: node
    plan: free
    buildCommand: npm install --prefix packages/config && npm install --prefix packages/types && npm install --prefix packages/utils && npm install --prefix apps/api && npm run build --prefix apps/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Web push. Generate once with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@payanam.app
