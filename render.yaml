services:
  - type: web
    name: payanam-api
    env: node
    plan: standard
    buildCommand: "pnpm install && pnpm turbo run build --filter=api"
    startCommand: "node apps/api/dist/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "https://payanam.netlify.app"
      - key: LOG_LEVEL
        value: info
      - key: API_URL
        value: "https://payanam-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://payanam.netlify.app"
